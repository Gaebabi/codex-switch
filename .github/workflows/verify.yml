name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verify-repository.py
      - run: python scripts/test-document-links.py
      - run: python scripts/test-audit-public.py
      - run: python scripts/verify-localization.py
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.4xx'
      - run: dotnet run --project tests/localization/CodexSwitch.Localization.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - run: dotnet run --project tests/temperatures/CodexSwitch.Temperatures.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - run: dotnet run --project tests/platform-security/CodexSwitch.PlatformSecurity.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - run: dotnet run --project tests/desktop-client/CodexSwitch.DesktopClient.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - run: dotnet run --project tests/protocol/CodexSwitch.Protocol.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - run: dotnet run --project tests/hardware/CodexSwitch.Hardware.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - run: dotnet run --project tests/composition/CodexSwitch.Composition.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - run: python scripts/audit-public.py --tree-only
      - run: git diff --check

  windows:
    name: Windows isolated checks
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.4xx'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set up CLI prerequisite runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned official CLI prerequisite
        shell: pwsh
        working-directory: tools/ci-codex
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Codex CLI install failed' }
          $taskCli = (Resolve-Path 'node_modules/@openai/codex-win32-x64/vendor/x86_64-pc-windows-msvc/bin/codex.exe').Path
          "CODEX_ACCOUNT_DESK_CLI=$taskCli" >> $env:GITHUB_ENV
          & $taskCli --version
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CLI did not launch' }
      - name: Publish and run disposable internal checks
        shell: pwsh
        run: ./scripts/build.ps1 -Verify
      - name: Inspect complete Windows runtime package
        run: python scripts/verify-runtime-package.py artifacts/win-x64 --rid win-x64 --output artifacts/runtime-win-x64.json
      - name: Verify read-only SQLite and WAL
        run: python scripts/verify-queues.py --executable artifacts/win-x64/CodexSwitch.exe
      - name: Publish disposable native shutdown fixture
        run: dotnet publish tests/windows-handoff/fixture/HandoffFixture.csproj -c Release -r win-x64 --self-contained true -p:UseSharedCompilation=false -o artifacts/handoff-fixture
      - name: Verify single-click handoff and normal Windows shutdown
        run: dotnet run --project tests/windows-handoff/CodexSwitch.WindowsHandoff.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false -- artifacts/handoff-fixture/HandoffFixture.exe
      - name: Verify language-pack parsing and lifecycle
        run: dotnet run --project tests/localization/CodexSwitch.Localization.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - name: Verify temperature parsing and sensor identity contracts
        run: dotnet run --project tests/temperatures/CodexSwitch.Temperatures.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - name: Verify native vault and private-file project boundary
        run: dotnet run --project tests/platform-security/CodexSwitch.PlatformSecurity.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - name: Verify native client project and refusal contracts
        run: dotnet run --project tests/desktop-client/CodexSwitch.DesktopClient.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - name: Verify protocol and read-only SQLite boundaries
        run: dotnet run --project tests/protocol/CodexSwitch.Protocol.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - name: Verify native resource collection and unsupported-OS boundaries
        run: dotnet run --project tests/hardware/CodexSwitch.Hardware.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - name: Verify shared composition and actual native trayless close
        run: dotnet run --project tests/composition/CodexSwitch.Composition.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false -- --native-ui
      - run: python -m pip install -r requirements-dev.txt
      - name: Run the published Windows app in isolated native UI mode
        shell: pwsh
        run: |
          $taskProcess = Start-Process artifacts/win-x64/CodexSwitch.exe -ArgumentList @('--verify-ui','artifacts/native-ui/windows/raw') -WindowStyle Hidden -PassThru
          if (!$taskProcess.WaitForExit(45000)) { throw 'Owned UI evidence process did not finish' }
          if ($taskProcess.ExitCode -ne 0) { throw 'Native Windows UI verification failed' }
      - name: Validate isolated Windows window exports
        env:
          EVIDENCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/verify-ui-evidence.py artifacts/native-ui/windows/raw artifacts/native-ui/windows/public --os Windows --revision "${{ env.EVIDENCE_REVISION }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-ui-windows
          path: artifacts/native-ui/windows/public
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Mac compilation (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.4xx'
      - name: Compile full application for the runner architecture
        run: dotnet publish src/macos/CodexSwitch.Mac.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:UseSharedCompilation=false -o artifacts/macos-ci/${{ matrix.rid }}
      - name: Inspect complete Mac runtime package
        run: python3 scripts/verify-runtime-package.py artifacts/macos-ci/${{ matrix.rid }} --rid ${{ matrix.rid }} --output artifacts/runtime-${{ matrix.rid }}.json
      - name: Run disposable read-only queue checks
        run: python3 scripts/verify-queues.py --executable artifacts/macos-ci/${{ matrix.rid }}/CodexSwitch
      - name: Verify native culture and pack lifecycle
        run: dotnet run --project tests/localization/CodexSwitch.Localization.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - name: Verify portable temperature parsing and presentation
        run: dotnet run --project tests/temperatures/CodexSwitch.Temperatures.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - name: Verify native Keychain vault and private-file project boundary
        run: dotnet run --project tests/platform-security/CodexSwitch.PlatformSecurity.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - name: Verify native client project and refusal contracts
        run: dotnet run --project tests/desktop-client/CodexSwitch.DesktopClient.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - name: Verify protocol and read-only SQLite boundaries
        run: dotnet run --project tests/protocol/CodexSwitch.Protocol.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - name: Verify native resource collection and unsupported-OS boundaries
        run: dotnet run --project tests/hardware/CodexSwitch.Hardware.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - name: Verify shared composition and actual native trayless close
        run: dotnet run --project tests/composition/CodexSwitch.Composition.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false -- --native-ui
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Run the published Mac app and capture only its native window
        run: artifacts/macos-ci/${{ matrix.rid }}/CodexSwitch --verify-ui artifacts/native-ui/${{ matrix.rid }}/raw
      - name: Validate isolated Mac window exports
        env:
          EVIDENCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/verify-ui-evidence.py artifacts/native-ui/${{ matrix.rid }}/raw artifacts/native-ui/${{ matrix.rid }}/public --os macOS --revision "$EVIDENCE_REVISION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-ui-${{ matrix.rid }}
          path: artifacts/native-ui/${{ matrix.rid }}/public
          if-no-files-found: error
          retention-days: 14
