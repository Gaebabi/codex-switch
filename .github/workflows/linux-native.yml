name: Linux native

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-native-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  keyring:
    name: Linux native keyring (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            architecture: X64
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            architecture: Arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.4xx'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the native test provider and D-Bus tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libsecret-1-0 gnome-keyring dbus-x11 libglib2.0-bin
      - name: Build the native storage contract executable
        run: dotnet build tests/linux-vault/CodexSwitch.LinuxVault.Tests.csproj -c Release --nologo -p:UseSharedCompilation=false -o artifacts/linux-native/${{ matrix.rid }}/tests
      - name: Verify actual keyring lifecycle on an owned disposable bus
        run: python scripts/verify-linux-keyring.py --assembly artifacts/linux-native/${{ matrix.rid }}/tests/CodexSwitch.LinuxVault.Tests.dll --architecture ${{ matrix.architecture }} --report artifacts/linux-native/${{ matrix.rid }}/keyring-summary.json
