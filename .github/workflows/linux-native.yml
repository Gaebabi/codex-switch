name: Linux native

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-native-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  CODEX_SWITCH_DISPOSABLE_RUNNER: 'true'

jobs:
  keyring:
    name: Linux native keyring (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            architecture: X64
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            architecture: Arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.4xx'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install the locked official standalone CLI without lifecycle scripts
        working-directory: tools/ci-codex
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          case '${{ matrix.rid }}' in
            linux-x64) task_triple=x86_64-unknown-linux-musl; task_module=codex-linux-x64 ;;
            linux-arm64) task_triple=aarch64-unknown-linux-musl; task_module=codex-linux-arm64 ;;
          esac
          task_cli="$PWD/node_modules/@openai/$task_module/vendor/$task_triple/bin/codex"
          test -x "$task_cli"
          "$task_cli" --version
          printf 'CODEX_SWITCH_STANDALONE_CLI=%s\n' "$task_cli" >> "$GITHUB_ENV"
      - name: Install the native test provider and D-Bus tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libsecret-1-0 libsqlite3-0 gnome-keyring libkf5wallet-bin libqca-qt5-2-plugins dbus-x11 libglib2.0-bin xvfb xauth x11-apps x11-utils xfwm4 xterm xdotool imagemagick libfontconfig1 fonts-dejavu-core fonts-noto-cjk meson ninja-build build-essential pkg-config libglib2.0-dev libgcrypt20-dev gettext xsltproc patch rpm
      - name: Build the checksum-pinned private encrypted Secret Service library
        run: python scripts/build-linux-secret.py --output artifacts/linux-secret
      - name: Install only the checksum-pinned official native client on this disposable runner
        run: python scripts/prepare-linux-client.py --architecture ${{ matrix.architecture }} --package-file artifacts/linux-native/${{ matrix.rid }}/upstream-client.deb
      - name: Build the native storage contract executable
        run: dotnet build tests/linux-vault/CodexSwitch.LinuxVault.Tests.csproj -c Release --nologo -p:UseSharedCompilation=false -o artifacts/linux-native/${{ matrix.rid }}/tests
      - name: Verify actual keyring lifecycle on an owned disposable bus
        run: python scripts/verify-linux-keyring.py --assembly artifacts/linux-native/${{ matrix.rid }}/tests/CodexSwitch.LinuxVault.Tests.dll --architecture ${{ matrix.architecture }} --report artifacts/linux-native/${{ matrix.rid }}/keyring-summary.json
      - name: Verify independent KDE KWallet lifecycle on another owned disposable bus
        run: python scripts/verify-linux-keyring.py --provider kwallet5 --assembly artifacts/linux-native/${{ matrix.rid }}/tests/CodexSwitch.LinuxVault.Tests.dll --architecture ${{ matrix.architecture }} --report artifacts/linux-native/${{ matrix.rid }}/kwallet-summary.json
      - name: Build the native executable trust contracts
        run: dotnet build tests/linux-client/CodexSwitch.LinuxClient.Tests.csproj -c Release --nologo -p:UseSharedCompilation=false -o artifacts/linux-native/${{ matrix.rid }}/client-tests
      - name: Build native desktop IPC trust contracts
        run: dotnet build tests/linux-desktop/CodexSwitch.LinuxDesktop.Tests.csproj -c Release --nologo -p:UseSharedCompilation=false -o artifacts/linux-native/${{ matrix.rid }}/desktop-tests
      - name: Publish the source Linux preview for the actual runner
        run: dotnet publish src/linux/CodexSwitch.Linux.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:UseSharedCompilation=false -o artifacts/linux-native/${{ matrix.rid }}/app
      - name: Inspect the complete Linux runtime package
        run: python scripts/verify-runtime-package.py artifacts/linux-native/${{ matrix.rid }}/app --rid ${{ matrix.rid }} --output artifacts/linux-native/${{ matrix.rid }}/runtime.json
      - name: Build headless terminal account and session contracts
        run: dotnet build tests/linux-terminal/CodexSwitch.LinuxTerminal.Tests.csproj -c Release --nologo -p:UseSharedCompilation=false -o artifacts/linux-native/${{ matrix.rid }}/terminal-tests
      - name: Verify actual headless commands with native standalone CLI and encrypted storage
        env:
          EVIDENCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/verify-linux-keyring.py --assembly artifacts/linux-native/${{ matrix.rid }}/tests/CodexSwitch.LinuxVault.Tests.dll --architecture ${{ matrix.architecture }} --terminal-assembly artifacts/linux-native/${{ matrix.rid }}/terminal-tests/CodexSwitch.LinuxTerminal.Tests.dll --terminal-app artifacts/linux-native/${{ matrix.rid }}/app/CodexSwitch --terminal-capture --report artifacts/linux-native/${{ matrix.rid }}/terminal-public/evidence.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-contracts-${{ matrix.rid }}
          path: artifacts/linux-native/${{ matrix.rid }}/terminal-public
          if-no-files-found: error
          retention-days: 14
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify actual app account cards and original OS titlebar together
        env:
          EVIDENCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/verify-linux-framed-ui.py --app artifacts/linux-native/${{ matrix.rid }}/app/CodexSwitch --output artifacts/linux-native/${{ matrix.rid }}/framed-public --revision "$EVIDENCE_REVISION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: framed-ui-${{ matrix.rid }}
          path: artifacts/linux-native/${{ matrix.rid }}/framed-public
          if-no-files-found: error
          retention-days: 14
      - name: Verify native read-only SQLite and committed WAL without content mutation
        run: python scripts/verify-queues.py --executable artifacts/linux-native/${{ matrix.rid }}/app/CodexSwitch
      - name: Verify native protocol and read-only SQLite boundaries
        run: dotnet run --project tests/protocol/CodexSwitch.Protocol.Tests.csproj -c Release --no-launch-profile -p:UseSharedCompilation=false
      - name: Verify genuine client identity, effective backend and managed policy with unchanged inputs
        run: python scripts/verify-linux-client.py --architecture ${{ matrix.architecture }} --executable artifacts/linux-native/${{ matrix.rid }}/app/CodexSwitch --tests artifacts/linux-native/${{ matrix.rid }}/client-tests/CodexSwitch.LinuxClient.Tests.dll --report artifacts/linux-native/${{ matrix.rid }}/client-summary.json
      - name: Verify attested legacy KWallet6 and normalized KSecrets with actual native app captures
        env:
          EVIDENCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/verify-kde6-containers.py --architecture ${{ matrix.architecture }} --tests artifacts/linux-native/${{ matrix.rid }}/tests --desktop-tests artifacts/linux-native/${{ matrix.rid }}/desktop-tests --app artifacts/linux-native/${{ matrix.rid }}/app --client-package artifacts/linux-native/${{ matrix.rid }}/upstream-client.deb --output artifacts/linux-native/${{ matrix.rid }}/kde6 --revision "$EVIDENCE_REVISION"
      - name: Capture only the published preview's native X11 window
        run: xvfb-run -a -s "-screen 0 1920x1080x24" artifacts/linux-native/${{ matrix.rid }}/app/CodexSwitch --verify-ui artifacts/linux-native/${{ matrix.rid }}/raw
      - name: Validate synthetic native Linux own-window exports
        env:
          EVIDENCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/verify-ui-evidence.py artifacts/linux-native/${{ matrix.rid }}/raw artifacts/linux-native/${{ matrix.rid }}/public --os Linux --revision "$EVIDENCE_REVISION"
      - name: Build complete three-format native preview candidates and source inventory
        run: python scripts/package-linux.py --app artifacts/linux-native/${{ matrix.rid }}/app --rid ${{ matrix.rid }} --output artifacts/linux-native/${{ matrix.rid }}/packages
      - name: Build a distinct compiled version solely for ordinary upgrade verification
        run: |
          dotnet publish src/linux/CodexSwitch.Linux.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:UseSharedCompilation=false -p:Version=1.38.99 -o artifacts/linux-native/${{ matrix.rid }}/previous-app
          python scripts/package-linux.py --app artifacts/linux-native/${{ matrix.rid }}/previous-app --rid ${{ matrix.rid }} --output artifacts/linux-native/${{ matrix.rid }}/previous-package --tar-only
      - name: Verify installed native app and data-preserving lifecycle on fresh Ubuntu/Debian/Fedora images
        run: python scripts/verify-linux-packages.py --packages artifacts/linux-native/${{ matrix.rid }}/packages --previous artifacts/linux-native/${{ matrix.rid }}/previous-package --rid ${{ matrix.rid }} --output artifacts/linux-native/${{ matrix.rid }}/fresh-packages
      - name: Verify ordinary installed UI and native lifecycles in a real isolated desktop session
        if: matrix.rid == 'linux-x64'
        run: python scripts/run-local-linux-desktop.py --packages artifacts/linux-native/${{ matrix.rid }}/packages --upstream-package artifacts/linux-native/${{ matrix.rid }}/upstream-client.deb --output artifacts/linux-native/${{ matrix.rid }}/desktop-session
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.rid == 'linux-x64'
        with:
          name: desktop-session-linux-x64
          path: |
            artifacts/linux-native/${{ matrix.rid }}/desktop-session/results/*.png
            artifacts/linux-native/${{ matrix.rid }}/desktop-session/results/session.json
            artifacts/linux-native/${{ matrix.rid }}/desktop-session/results/framed-accounts.json
            artifacts/linux-native/${{ matrix.rid }}/desktop-session/results/terminal-lifecycle.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-preview-candidates-${{ matrix.rid }}
          path: |
            artifacts/linux-native/${{ matrix.rid }}/packages/*.tar.gz
            artifacts/linux-native/${{ matrix.rid }}/packages/*.deb
            artifacts/linux-native/${{ matrix.rid }}/packages/*.rpm
            artifacts/linux-native/${{ matrix.rid }}/packages/*.json
            artifacts/linux-native/${{ matrix.rid }}/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-app-ui-${{ matrix.rid }}
          path: artifacts/linux-native/${{ matrix.rid }}/fresh-packages/public
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-peer-${{ matrix.rid }}
          path: artifacts/linux-native/${{ matrix.rid }}/kde6/kwallet6/results/desktop
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ui-${{ matrix.rid }}
          path: artifacts/linux-native/${{ matrix.rid }}/public
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kwallet6-ui-${{ matrix.rid }}
          path: artifacts/linux-native/${{ matrix.rid }}/kde6/kwallet6/results/public
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ksecrets-ui-${{ matrix.rid }}
          path: artifacts/linux-native/${{ matrix.rid }}/kde6/ksecrets/results/public
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ksecrets-current-ui-${{ matrix.rid }}
          path: artifacts/linux-native/${{ matrix.rid }}/kde6/ksecrets-current/results/public
          if-no-files-found: error
          retention-days: 14
